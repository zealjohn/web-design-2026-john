<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咖啡店飲品區</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <main>
        <section class="menu">

            <h2>人氣飲品</h2>

            <div class="menu-grid">

                <!-- 基本三張商品卡片 -->
                <article class="menu-card">
                    <img src="images/coffee1.jpg" alt="美式咖啡">
                    <h3>美式咖啡</h3>
                    <p>$100</p>
                </article>

                <article class="menu-card">
                    <img src="images/coffee2.jpg" alt="拿鐵咖啡">
                    <h3>拿鐵咖啡</h3>
                    <p>$130</p>
                </article>

                <article class="menu-card">
                    <img src="images/coffee3.jpg" alt="卡布奇諾">
                    <h3>卡布奇諾</h3>
                    <p>$130</p>
                </article>

                <!-- 挑戰任務：新增四張商品卡片 -->
                <article class="menu-card">
                    <img src="images/coffee1.jpg" alt="摩卡咖啡">
                    <h3>摩卡</h3>
                    <p>$150</p>
                </article>

                <article class="menu-card">
                    <img src="images/coffee2.jpg" alt="焦糖拿鐵">
                    <h3>焦糖拿鐵</h3>
                    <p>$145</p>
                </article>

                <article class="menu-card">
                    <img src="images/coffee3.jpg" alt="抹茶">
                    <h3>抹茶</h3>
                    <p>$140</p>
                </article>

                <article class="menu-card">
                    <img src="images/coffee1.jpg" alt="蛋糕">
                    <h3>蛋糕</h3>
                    <p>$120</p>
                </article>

            </div>

        </section>
    </main>

</body>

</html>
